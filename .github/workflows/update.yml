name: EAS Update on Push
on:
  push:
    branches:
      - master
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4
      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: 📦 Install dependencies
        run: bun install
      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: 🚀 Create EAS Update
        run: eas update --branch preview --platform android --message "${{
          github.event.head_commit.message }}" --non-interactive
